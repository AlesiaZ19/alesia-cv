<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Алеся Заяц — Lead IT Recruiter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header" id="header">
        <a href="#hero" class="logo" id="logo"></a>
        <ul class="nav-links" id="navLinks"></ul>
        <div class="lang-toggle" id="langToggle">
            <span class="lang-opt" data-lang="en">EN</span>
            <span class="lang-divider"></span>
            <span class="lang-opt" data-lang="ru">RU</span>
            <div class="lang-slider" id="langSlider"></div>
        </div>
        <div class="burger-menu" id="burgerMenu">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>
    <div class="mobile-menu" id="mobileMenu">
        <ul class="mobile-nav-links" id="mobileNavLinks"></ul>
    </div>

    <div class="container">
        <section id="hero" class="hero">
            <h1 id="heroName"></h1>
            <p id="heroTitle"></p>
        </section>

        <section id="about">
            <h2 id="aboutTitle"></h2>
            <div class="glass-card contact-item">
                <p id="aboutText"></p>
            </div>
        </section>

        <section id="achievements">
            <h2 id="achievementsTitle"></h2>
            <div class="stats" id="achievementsStats"></div>
        </section>

        <section id="skills">
            <h2 id="skillsTitle"></h2>
            <div class="skills-grid" id="skillsGrid"></div>
        </section>

        <section id="experience">
            <h2 id="experienceTitle"></h2>
            <div id="experienceList"></div>
        </section>

        <section id="education">
            <h2 id="educationTitle"></h2>
            <div id="educationList"></div>
        </section>

        <section id="certificates">
            <h2 id="certificatesTitle"></h2>
            <div class="cert-grid" id="certificatesList"></div>
        </section>

        <section id="languages">
            <h2 id="languagesTitle"></h2>
            <div id="languagesList"></div>
        </section>

        <section id="contact">
            <h2 id="contactTitle"></h2>
            <div class="contact" id="contactList"></div>
            <div class="cv-download-wrapper">
                <a href="Alesia_Zayats_CV.docx" download class="cv-download-btn" id="downloadBtn">
                    <i class="fas fa-download"></i> <span id="downloadLabel"></span>
                </a>
            </div>
        </section>
    </div>

    <button class="scroll-top" id="scrollTop" aria-label="Scroll to top">
        <i class="fas fa-arrow-up"></i>
    </button>

    <div id="lightbox" class="lightbox">
        <img id="lightboxImg" class="lightbox-img" src="" alt="">
    </div>

    <script src="data.js"></script>
    <script src="script.js" defer></script>
</body>
</html>
